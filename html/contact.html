<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | STEPPING STONE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/styleContact.css">
  <script src="../js/contact.js" defer></script>
</head>

<body>
  <header class="contact-page-header">
    <div class="contact-header-inner">
      <a class="contact-brand" href="Home.html" aria-label="Stepping Stone home">
        <span class="contact-brand-mark" aria-hidden="true">SS</span>
        <span>
          <span class="contact-brand-name">Stepping Stone</span>
          <span class="contact-brand-caption">Driving confidence</span>
        </span>
      </a>
      <nav class="contact-nav" aria-label="Main navigation">
        <a href="Home.html#about">About</a>
        <a href="Home.html#products">Products</a>
        <a href="Home.html#solutions">Solutions</a>
        <a href="Home.html#news">News</a>
        <a href="#contact-form-title" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <div class="wrapper">
    <div class="contact-container">
      <h1>Contact Us</h1>
      <p><b>궁금한 점을 문의해 주세요.</b><br>
        아래 양식을 작성해 주시면 이메일로 답변드리겠습니다.</p>

      <section class="contact-form-section" aria-labelledby="contact-form-title">
        <h2 id="contact-form-title">문의하기</h2>
        <p class="form-notice">
          보내주신 문의는 담당자 이메일로 전달되며, 입력하신 이메일로 답변드리겠습니다.
        </p>
        <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="7495a15f-b08f-49db-9c82-1379f8e0a2d2">
          <input type="hidden" name="subject" value="STEPPING STONE 새 문의">
          <input type="hidden" name="from_name" value="STEPPING STONE 웹사이트">
          <input class="form-honeypot" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

          <div class="form-field">
            <label for="contact-name">이름 <span aria-hidden="true">*</span></label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="contact-email">이메일 <span aria-hidden="true">*</span></label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-field">
            <label for="contact-phone">연락처</label>
            <input id="contact-phone" name="phone" type="tel" autocomplete="tel">
          </div>

          <div class="form-field">
            <label for="contact-topic">문의 유형 <span aria-hidden="true">*</span></label>
            <select id="contact-topic" name="inquiry_type" required>
              <option value="" selected disabled>선택해 주세요</option>
              <option value="제품 문의">제품 문의</option>
              <option value="구매 및 배송">구매 및 배송</option>
              <option value="기술 지원">기술 지원</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <div class="form-field">
            <label for="contact-address">관련 주소</label>
            <select id="contact-address" name="address">
              <option value="" selected>선택해 주세요 (선택 항목)</option>
              <option value="38 Potts Lane, Potts Hill NSW 2143">회사 주소 (38 Potts Lane, Potts Hill NSW 2143)</option>
              <option value="other">다른 주소 직접 입력</option>
              <option value="해당 없음">해당 없음</option>
            </select>
          </div>

          <div class="form-field" id="custom-address-field" hidden>
            <label for="contact-custom-address">주소 입력 <span aria-hidden="true">*</span></label>
            <input id="contact-custom-address" name="custom_address" type="text" autocomplete="street-address" disabled>
          </div>

          <div class="form-field form-field-full">
            <label for="contact-message">문의 내용 <span aria-hidden="true">*</span></label>
            <textarea id="contact-message" name="message" rows="6" required></textarea>
          </div>

          <button class="contact-submit" type="submit">문의 보내기</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

    </div>
  </div>
  
  <footer class="site-footer">
    <p>&copy; 2026 STEPPING STONE. All rights reserved.</p>
    <div class="footer-links">
      <a href="#">Privacy Policy</a> |
      <a href="#">Terms</a>
    </div>
  </footer>
</body>
</html>
